<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Clicker</title>
</head>
<body>
    <h2>Felipe</h2>
    <img id="gato1" src="img/gato1.jpg" alt="gato" width="150">
    <h3>Clicks: <p id="clicks1">0</p></h3>
    <h2>George</h2>
    <img id="gato2" src="img/gato2.jpg" alt="gato2" width="150">
    <h3>Clicks: <p id="clicks2">0</p></h3>
</body>

<script>
    let cont=0;
    let cont2=0;

    const img1 = document.getElementById("gato1");
    const img2 = document.getElementById("gato2");

    img1.addEventListener("click", function(){
    cont++;
    document.getElementById("clicks1").innerHTML=cont;
    })

    img2.addEventListener("click", function(){
    cont2++;
    document.getElementById("clicks2").innerHTML=cont2;
    });
</script>
</html>
